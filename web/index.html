<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>藤球比赛计分系统</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="stylesheet" href="/vendor/tom-select/tom-select.default.min.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<div class="login-screen" id="startup-screen">
  <div class="login-card">
    <div class="brand-login">
      <span class="logo">藤</span>
      <div class="title">藤球比赛计分系统</div>
    </div>
    <p id="startup-message" role="status">正在加载计分系统…</p>
    <button class="btn" type="button" onclick="location.reload()">重新加载</button>
    <noscript>请启用 JavaScript 后重新打开本页。</noscript>
  </div>
</div>
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span class="logo">藤</span>
      <div>
        <div class="title">藤球比赛计分系统</div>
        <div class="subtitle" id="event-line">—</div>
      </div>
    </div>
    <div class="topbar-right">
      <label class="event-switcher">
        <span>当前赛事</span>
        <select id="event-select" class="select" title="当前赛事"></select>
      </label>
      <button class="btn btn-ghost" id="btn-new-event">新建赛事</button>
      <span id="net-badge" class="badge badge-ok">在线</span>
      <span id="user-line" class="user-line"></span>
      <button class="btn btn-ghost" id="btn-logout">退出</button>
    </div>
  </header>
  <div class="layout">
    <nav class="sidenav" id="sidenav"></nav>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/vendor/tom-select/tom-select.base.min.js"></script>
<script type="module" src="/js/main.js" onerror="document.getElementById('startup-message').textContent = '页面脚本加载失败，请重新加载。'"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打印成绩</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #eee; color: #111;
      font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
    }
    .print-status {
      max-width: 560px; margin: 12vh auto; padding: 28px 30px; background: #fff;
      border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 2px 8px rgba(20, 40, 80, .08);
      line-height: 1.7;
    }
    .print-status h1 { margin: 0 0 10px; font-size: 20px; }
    .print-status p { margin: 0 0 8px; }
    .print-status .muted { color: #66748e; font-size: 13px; }
    .print-status .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .print-status a, .print-status button {
      display: inline-block; padding: 9px 20px; border-radius: 8px; border: 1px solid #1462c8;
      background: #fff; color: #1462c8; font: inherit; cursor: pointer; text-decoration: none;
    }
    .print-status button.primary { background: #1462c8; color: #fff; }
    .print-status[data-print-error] { border-color: #e2b6b1; }
    .print-status[data-print-error] h1 { color: #c0392b; }
    .loading { color: #66748e; }
  </style>
</head>
<body>
  <div id="print-status" class="print-status" role="status" aria-live="polite">
    <h1 id="print-title">正在加载打印内容…</h1>
    <p id="print-message" class="loading">请稍候，正在读取当前成绩数据。</p>
    <div id="print-actions" class="actions" hidden></div>
  </div>
  <noscript>
    <div class="print-status">
      <h1>需要启用 JavaScript</h1>
      <p>打印页需要用登录凭据读取当前数据，请在浏览器中启用 JavaScript 后重试。</p>
      <div class="actions"><a href="/">返回系统</a></div>
    </div>
  </noscript>
  <script type="module" src="/js/print.js"></script>
</body>
</html>
